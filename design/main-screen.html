<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K LOAD — макет · главный экран</title>
<style>
/* ===== шрифты webcore (кириллица) ===== */
@font-face{font-family:'Chakra Petch';src:url('assets/fonts/ChakraPetch-Regular.ttf');font-weight:400;font-style:normal}
@font-face{font-family:'Chakra Petch';src:url('assets/fonts/ChakraPetch-Bold.ttf');font-weight:700;font-style:normal}
@font-face{font-family:'IBM Plex Mono';src:url('assets/fonts/IBMPlexMono-Regular.ttf');font-weight:400;font-style:normal}
@font-face{font-family:'IBM Plex Mono';src:url('assets/fonts/IBMPlexMono-Bold.ttf');font-weight:700;font-style:normal}

/* ===== палитра B (amber terminal) + пластик корпуса ===== */
:root{
  --desk:#0B0B0D;
  --plastic:#262321; --plastic-hi:#3B3733; --plastic-lo:#141211; --plastic-edge:#0C0B0A;
  --bg:#050300; --screen:#070402;
  --amber:#FFB000; --soft:#FFCF7A; --dim:#33230A; --dimtxt:#8A6E38;
  --white:#EDE8DC;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--desk);
  background-image:radial-gradient(1200px 800px at 50% 18%,#111114 0%,#0B0B0D 55%,#060607 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;min-height:100vh;overflow:hidden;
  font-family:'Chakra Petch',sans-serif;color:var(--white);
  -webkit-font-smoothing:antialiased;
}

/* ================================================================
   ТЕЛЕВИЗОР = окно приложения (macOS)
   ================================================================ */
.tv{
  position:relative;
  width:var(--w,500px);height:var(--h,800px);
  min-width:440px;min-height:760px;max-width:680px;max-height:1020px;
  border-radius:26px;
  background:linear-gradient(155deg,#2E2A27 0%,var(--plastic) 34%,#1D1B19 78%,#161413 100%);
  box-shadow:
    0 40px 90px rgba(0,0,0,.62),
    0 6px 18px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.09),
    inset 1px 0 0 rgba(255,255,255,.04),
    inset -1px -1px 0 rgba(0,0,0,.6);
  display:flex;flex-direction:column;
  padding:26px 22px 0;
  user-select:none;
}

/* ---- экран: стекло с лёгкой выпуклостью ---- */
.glass{
  position:relative;flex:1;border-radius:16px;overflow:hidden;
  background:var(--screen);
  box-shadow:
    inset 0 0 0 1px #000,
    inset 0 2px 14px rgba(0,0,0,.9),
    inset 0 0 70px rgba(0,0,0,.62),
    0 1px 0 rgba(255,255,255,.05);
}
/* блик выпуклого стекла — статичный, не эффект */
.glass::before{
  content:"";position:absolute;inset:0;z-index:6;pointer-events:none;
  background:
    radial-gradient(120% 90% at 50% 8%,rgba(255,255,255,.05) 0%,rgba(255,255,255,0) 34%),
    radial-gradient(140% 120% at 50% 50%,rgba(0,0,0,0) 58%,rgba(0,0,0,.5) 100%);
}
/* сканлайны */
.glass::after{
  content:"";position:absolute;inset:0;z-index:5;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);
  opacity:.5;
}
#noise{position:absolute;inset:0;z-index:1;width:100%;height:100%;
  opacity:.14;image-rendering:pixelated;
  animation:flicker 4.2s infinite}
@keyframes flicker{0%,100%{opacity:.14}92%{opacity:.14}93%{opacity:.11}94%{opacity:.15}96%{opacity:.12}}

/* ---- содержимое экрана ---- */
.ui{position:absolute;inset:0;z-index:4;opacity:0}
.booted .ui{opacity:1;transition:opacity .5s ease .05s}

/* mac-кнопки: только они наверху */
.lights{position:absolute;top:14px;left:16px;display:flex;gap:8px;z-index:7}
.light{width:12px;height:12px;border-radius:50%;border:.5px solid rgba(0,0,0,.45);
  box-shadow:inset 0 0 1px rgba(255,255,255,.35)}
.light.r{background:#FF5F57}.light.y{background:#FEBC2E}
.light.g{background:#28C840;filter:saturate(.25) brightness(.62);cursor:default}
.light:not(.g){cursor:pointer}
.light:not(.g):active{filter:brightness(.8)}
.tv:not(.booted) .light.g{cursor:help}

/* ---- строка поиска ---- */
.search-wrap{position:absolute;left:7%;right:7%;top:40%;z-index:4}
.search{
  position:relative;display:flex;align-items:center;gap:11px;min-height:50px;
  background:rgba(5,3,0,.72);
  border:1px solid rgba(255,176,0,.26);
  border-radius:10px;padding:13px 16px;cursor:text;
  transition:border-color .25s ease, box-shadow .25s ease;
}
.search.focus{border-color:rgba(255,176,0,.62);box-shadow:0 0 0 1px rgba(255,176,0,.14),0 0 22px rgba(255,176,0,.10)}
.search .ic{flex:none;display:flex;color:var(--dimtxt)}
.search.focus .ic{color:var(--amber)}
.search input{
  flex:1;background:none;border:none;outline:none;padding:0;
  font:400 14px/1.35 'Chakra Petch',sans-serif;letter-spacing:.01em;
  color:var(--soft);caret-color:var(--amber);min-width:0;
}
.search .ph{
  position:absolute;left:52px;right:18px;top:50%;transform:translateY(-50%);
  font:400 13px/1.45 'Chakra Petch',sans-serif;letter-spacing:.01em;
  color:#9A7B3F;pointer-events:none;cursor:text;
}
.search .ph.off{display:none}

/* ---- состояния под строкой: ищу / найдено ---- */
.state{margin-top:16px;min-height:44px;font-family:'IBM Plex Mono',monospace}
.state .row1{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.state .word{font-weight:700;font-size:12px;letter-spacing:.22em;color:var(--amber)}
.state .pct{font-size:12px;color:var(--dimtxt);font-variant-numeric:tabular-nums}
.scan{margin-top:8px;height:3px;background:rgba(255,176,0,.12);position:relative;overflow:hidden;border-radius:2px}
.scan i{position:absolute;top:0;bottom:0;left:0;width:34%;background:var(--amber);
  box-shadow:0 0 10px rgba(255,176,0,.55);border-radius:2px}
.state.found .word{color:var(--soft)}
.state .note{margin-top:9px;font-size:11px;letter-spacing:.06em;color:#6E5A31}
.hidden{display:none}

/* ================================================================
   ВКЛЮЧЕНИЕ ТЕЛЕВИЗОРА (CRT power-on) — оверлей внутри стекла
   ================================================================ */
.boot{position:absolute;inset:0;z-index:9;background:#000;pointer-events:auto;cursor:pointer}
.boot .beam{
  position:absolute;left:50%;top:50%;width:2px;height:2px;background:#FFF;
  transform:translate(-50%,-50%);border-radius:50%;
  box-shadow:0 0 18px 4px rgba(255,255,255,.9),0 0 60px 18px rgba(255,220,150,.5);
  animation:beam 1.5s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes beam{
  0%   {width:2px;height:2px;opacity:0}
  12%  {width:3px;height:3px;opacity:1}
  30%  {width:2px;height:2px;transform:translate(-50%,-50%) scaleX(1)}
  44%  {width:96%;height:3px;border-radius:2px;transform:translate(-50%,-50%);opacity:1}
  62%  {width:100%;height:100%;border-radius:0;transform:translate(0,0);opacity:.95;
        box-shadow:0 0 90px 30px rgba(255,240,210,.85)}
  78%  {opacity:.75}
  100% {width:100%;height:100%;border-radius:0;transform:translate(0,0);opacity:0}
}
.booted .boot{display:none}

/* ---- VPN-плашка: системное уведомление внутри экрана ---- */
.vpn{
  position:absolute;top:14px;right:14px;z-index:8;max-width:320px;
  display:flex;gap:11px;align-items:flex-start;
  background:rgba(13,9,2,.92);
  border:1px solid rgba(255,176,0,.34);
  border-radius:8px;padding:12px 13px;
  box-shadow:0 10px 26px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,176,0,.10);
  transform:translateX(calc(100% + 30px));
  transition:transform .5s cubic-bezier(.2,.9,.25,1);
}
.vpn.show{transform:translateX(0)}
.vpn .vic{flex:none;margin-top:1px;color:var(--amber)}
.vpn .vt{font:400 12.5px/1.45 'Chakra Petch',sans-serif;color:var(--soft)}
.vpn .vt b{font-weight:700;color:var(--white)}
.vpn .x{flex:none;margin-left:2px;background:none;border:none;color:#6E5A31;cursor:pointer;
  font:700 13px 'IBM Plex Mono',monospace;line-height:1;padding:2px}
.vpn .x:hover{color:var(--amber)}

/* ================================================================
   НИЖНЯЯ РАМКА: кнопка папки · выдавленный логотип · Boosty
   ================================================================ */
.band{
  height:80px;flex:none;display:flex;align-items:center;
  padding:0 20px;position:relative;
}
.plate{
  width:46px;height:46px;border-radius:50%;flex:none;cursor:pointer;
  border:1px solid var(--plastic-edge);
  background:radial-gradient(circle at 34% 28%,#413D39 0%,#2A2724 52%,#1B1917 100%);
  box-shadow:
    0 3px 5px rgba(0,0,0,.6),
    0 1px 2px rgba(0,0,0,.5),
    inset 0 1px 1px rgba(255,255,255,.11),
    inset 0 -3px 5px rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;
  color:#151312;transition:transform .06s ease;
}
.plate:active{transform:translateY(1px);
  box-shadow:0 1px 2px rgba(0,0,0,.55), inset 0 2px 5px rgba(0,0,0,.65), inset 0 1px 1px rgba(255,255,255,.05)}
.plate svg,.plate span{filter:drop-shadow(0 1px 0 rgba(255,255,255,.08))}
.plate .dollar{font:700 19px 'Chakra Petch',sans-serif;color:#161413;line-height:1;text-decoration:none}
a.plate{text-decoration:none}

.logo-deboss{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);
  height:24px;color:#161412;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,.075)) drop-shadow(0 -1px 1px rgba(0,0,0,.7));
}
.logo-deboss svg{height:24px;width:auto;display:block}

/* ---- ручка изменения размера ---- */
.grip{position:absolute;right:6px;bottom:6px;width:18px;height:18px;cursor:nwse-resize;z-index:20;
  opacity:.5}
.grip::before{content:"";position:absolute;inset:4px;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.25) 0 1px,transparent 1px 5px);
  border-radius:2px}
.grip:hover{opacity:.9}

/* ---- шторка-подсказка выбранной папки (терминальная строка) ---- */
.toast{
  position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(6px);
  z-index:7;font:400 11.5px/1 'IBM Plex Mono',monospace;letter-spacing:.04em;
  color:var(--soft);background:rgba(5,3,0,.9);border:1px solid rgba(255,176,0,.3);
  border-radius:6px;padding:9px 13px;opacity:0;pointer-events:none;
  transition:opacity .3s ease, transform .3s ease;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast b{color:var(--amber);font-weight:700}

/* ================================================================
   ДЕМО-ПУЛЬТ (вне макета — только для просмотра)
   ================================================================ */
.demo{display:flex;gap:10px;align-items:center;
  font:400 11px/1 'IBM Plex Mono',monospace;color:#6B6B70;letter-spacing:.06em;user-select:none}
.demo button{
  font:700 10.5px 'IBM Plex Mono',monospace;letter-spacing:.12em;cursor:pointer;
  color:#9A9AA0;background:#131316;border:1px solid #26262B;border-radius:5px;padding:7px 11px}
.demo button:hover{color:#CFCFD4;border-color:#3A3A41}
.demo button.on{color:#0A0A0A;background:var(--amber);border-color:var(--amber)}
.demo .sep{color:#3A3A3F}

@media (prefers-reduced-motion: reduce){
  #noise{animation:none}
  .boot{display:none}
  .ui{opacity:1}
  .vpn{transition:opacity .2s ease;transform:none;opacity:0;pointer-events:none}
  .vpn.show{opacity:1;pointer-events:auto}
}
</style>
</head>

<script>
const tv=document.getElementById('tv'),glass=document.getElementById('glass'),
      boot=document.getElementById('boot'),vpn=document.getElementById('vpn'),
      q=document.getElementById('q'),search=document.getElementById('search'),
      state=document.getElementById('state'),sw=document.getElementById('sw'),
      sp=document.getElementById('sp'),si=document.getElementById('si'),sn=document.getElementById('sn'),
      toast=document.getElementById('toast');
const hash=new URLSearchParams(location.hash.slice(1));

/* ---- шум телевизора: канвас 120×72, перерисовка ~12 fps ---- */
const cv=document.getElementById('noise'),cx=cv.getContext('2d',{alpha:false});
cv.width=120;cv.height=72;
let noiseOn=true;
function drawNoise(){
  if(!noiseOn)return;
  const img=cx.createImageData(120,72),d=img.data;
  for(let i=0;i<d.length;i+=4){const v=(Math.random()*255)|0;d[i]=v;d[i+1]=v;d[i+2]=v;d[i+3]=255;}
  cx.putImageData(img,0,0);
  setTimeout(()=>requestAnimationFrame(drawNoise),80);
}
drawNoise();

/* ---- включение: точка → линия → вспышка → интерфейс ---- */
let booted=false;
function finishBoot(){
  if(booted)return;booted=true;
  tv.classList.add('booted');
  setTimeout(()=>{ if(hash.get('vpn')!=='on' && vpnDemoOff) showVpn(); },2000);
}
if(hash.get('boot')==='skip'){finishBoot();}
else{
  boot.addEventListener('click',finishBoot);
  window.addEventListener('keydown',e=>{if(!booted&&(e.key==='Enter'||e.key===' '))finishBoot();});
  boot.addEventListener('animationend',finishBoot);
  setTimeout(finishBoot,2600); // страховка, если событие анимации потерялось
}

/* ---- VPN ---- */
let vpnDemoOff=true;
function showVpn(){vpn.classList.add('show')}
document.getElementById('vpn-x').onclick=()=>vpn.classList.remove('show');
const bOff=document.getElementById('d-vpn-off'),bOn=document.getElementById('d-vpn-on');
function setVpnDemo(off){
  vpnDemoOff=off;
  bOff.classList.toggle('on',off);bOn.classList.toggle('on',!off);
  if(!off)vpn.classList.remove('show');
  else if(booted)showVpn();
}
bOff.onclick=()=>setVpnDemo(true);
bOn.onclick=()=>setVpnDemo(false);

/* ---- повтор включения ---- */
document.getElementById('d-replay').onclick=()=>{
  booted=false;tv.classList.remove('booted');vpn.classList.remove('show');
  const b2=boot.querySelector('.beam');b2.style.animation='none';void b2.offsetWidth;b2.style.animation='';
  boot.style.display='';setTimeout(()=>{finishBoot();},1600);
  boot.removeEventListener('animationend',finishBoot);
  boot.addEventListener('animationend',finishBoot);
};

/* ---- поиск: пауза в печати → ИЩУ… → НАЙДЕНО ---- */
let timer=null,prog=null;
function resetState(){clearInterval(prog);state.classList.add('hidden');si.style.width='0%';
  ph.classList.toggle('off',q.value.length>0);}
q.addEventListener('input',()=>{
  clearTimeout(timer);
  if(!q.value.trim()){resetState();return;}
  timer=setTimeout(startSearch,600);
});
function startSearch(){
  ph.classList.add('off');
  state.classList.remove('hidden','found');sn.classList.add('hidden');
  sw.textContent='ИЩУ…';
  let p=0;clearInterval(prog);
  prog=setInterval(()=>{
    p+=Math.random()*9+3;if(p>=100){p=100;clearInterval(prog);found();}
    sp.textContent=Math.floor(p)+'%';si.style.width=p*0.9+'%';
  },110);
}
function found(){
  state.classList.add('found');sw.textContent='НАЙДЕНО';sp.textContent='';
  si.style.width='100%';sn.classList.remove('hidden');
}
if(hash.get('demo')==='found'){finishBoot();q.value='https://youtu.be/jNQXAC9IVRw';startSearch();}
else if(hash.get('demo')==='search'){finishBoot();q.value='a-ha take on me';startSearch();}

/* ---- фокус строки и плейсхолдер ---- */
search.addEventListener('click',()=>q.focus());
q.addEventListener('input',()=>ph.classList.toggle('off',q.value.length>0));
q.addEventListener('focus',()=>search.classList.add('focus'));
q.addEventListener('blur',()=>search.classList.remove('focus'));

/* ---- папка: терминальная подсказка ---- */
let toastT=null;
document.getElementById('folder').onclick=()=>{
  toast.classList.add('show');clearTimeout(toastT);
  toastT=setTimeout(()=>toast.classList.remove('show'),2200);
};

/* ---- изменение окна: ручка за нижний правый угол ---- */
const grip=document.getElementById('grip');
let sx,sy,sw0,sh0,dragging=false;
grip.addEventListener('pointerdown',e=>{
  dragging=true;sx=e.clientX;sy=e.clientY;
  sw0=tv.offsetWidth;sh0=tv.offsetHeight;
  grip.setPointerCapture(e.pointerId);e.preventDefault();
});
grip.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const w=Math.min(680,Math.max(440,sw0+e.clientX-sx));
  const h=Math.min(1020,Math.max(760,sh0+e.clientY-sy));
  tv.style.setProperty('--w',w+'px');tv.style.setProperty('--h',h+'px');
});
grip.addEventListener('pointerup',()=>dragging=false);
</script>
