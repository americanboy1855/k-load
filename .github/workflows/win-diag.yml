name: win-diag

# Диагностика окна на настоящей Windows-машине: ресайз + скриншоты +
# HRESULT drag-канала. Артефакты — сырые кадры и results.txt.
on:
  workflow_dispatch:
  push:
    branches: [win-diag]

jobs:
  diag:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Установка curl (vcpkg)
        run: vcpkg install "curl:x64-windows-static-md"

      - name: Сборка ядра kdcore.dll
        run: |
          cmake -S kdcore -B kdcore/build-win `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          cmake --build kdcore/build-win --config Release

      - name: Инструменты (yt-dlp/ffmpeg/ffprobe/deno)
        run: pwsh win/fetch-tools-win.ps1

      - name: Диагностический прогон (реальное окно, PrintWindow, HRESULT)
        working-directory: app
        shell: pwsh
        env:
          K_LOAD_DYLIB: ${{ github.workspace }}/kdcore/build-win/Release/kdcore.dll
          K_LOAD_TOOLS: ${{ github.workspace }}/core/tools-win
        run: flutter test integration_test/win_diag_test.dart -d windows

      - name: Артефакты диагностики
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-diag
          path: |
            C:/Users/runneradmin/AppData/Local/Temp/kdiag/**
          if-no-files-found: warn
