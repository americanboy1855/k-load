name: win-build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  kernel:
    # Этап 1: ядро kdcore.dll + контрактные тесты на Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка curl (vcpkg; TLS = Schannel по умолчанию)
        run: vcpkg install "curl:x64-windows-static-md"

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Конфигурация CMake
        run: >
          cmake -S kdcore -B kdcore/build-win
          -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
        shell: pwsh

      - name: Сборка kdcore.dll и kd_tests
        run: cmake --build kdcore/build-win --config Release

      - name: Контрактные тесты ядра
        run: ./kdcore/build-win/Release/kd_tests.exe

  app:
    # Сборка приложения: ядро + Flutter + портативная папка.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Установка curl (vcpkg)
        run: vcpkg install "curl:x64-windows-static-md"

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Сборка ядра kdcore.dll
        run: |
          cmake -S kdcore -B kdcore/build-win `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          cmake --build kdcore/build-win --config Release

      - name: Юнит-тесты Flutter
        run: flutter test
        working-directory: app

      - name: Сборка приложения
        run: flutter build windows --release
        working-directory: app

      - name: Компоновка портативной папки
        shell: pwsh
        run: |
          $out = "dist/K LOAD"
          New-Item -ItemType Directory -Force -Path "$out/tools/ytdlp" | Out-Null
          Copy-Item "app/build/windows/x64/runner/Release/*" $out -Recurse -Force
          Copy-Item "kdcore/build-win/Release/kdcore.dll" $out -Force

      - uses: actions/upload-artifact@v4
        with:
          name: K-LOAD-win-portable
          path: dist/K LOAD
